# LOCAL PROPOSAL. Owner approval required before replacing the live workflow.
name: Refresh public Queensland GFS weather
on:
  schedule:
    - cron: '40 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-gfs-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event.repository.private == false && vars.ENABLE_WEATHER_PIPELINE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Configure weather-only ledger commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Lightweight local gate (no NOAA, dependencies or Pages build)
        id: gate
        run: python recovery.py plan
      - name: Persist bounded attempt before external work
        if: steps.gate.outputs.action != 'none'
        run: |
          git add state/recovery.json
          git commit -m '[CF-Pages-Skip] Reserve bounded weather check'
          git push origin HEAD:main
      - name: Install decoder only when discovery is due
        if: steps.gate.outputs.action == 'acquire'
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate code before any NOAA access
        if: steps.gate.outputs.action == 'acquire'
        run: python -m unittest discover -s tests -v
      - name: Acquire only a newer complete model with durable model reservation
        if: steps.gate.outputs.action == 'acquire'
        id: acquire
        run: python recovery.py acquire
      - name: Publish validated complete site, or retry existing bytes without NOAA
        if: steps.acquire.outputs.publish == 'true' || steps.gate.outputs.action == 'republish'
        run: |
          python validate.py public
          git add state/recovery.json public
          git commit -m 'Publish validated weather and bounded recovery status'
          git push origin HEAD:main
      - name: Persist discovery outcome without a Pages build
        if: steps.gate.outputs.action == 'acquire' && steps.acquire.outputs.publish != 'true'
        run: |
          git add state/recovery.json
          git commit -m '[CF-Pages-Skip] Record bounded NOAA discovery outcome'
          git push origin HEAD:main
      - name: Verify complete public publication
        id: verify
        if: steps.acquire.outputs.publish == 'true' || steps.gate.outputs.action == 'republish' || steps.gate.outputs.action == 'verify'
        continue-on-error: true
        env:
          WEATHER_BASE_URL: ${{ vars.WEATHER_BASE_URL }}
        run: python verify_remote.py "$WEATHER_BASE_URL" --wait 600
      - name: Persist publication outcome for automatic recovery
        if: steps.verify.outcome == 'success' || steps.verify.outcome == 'failure'
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          if [ "$VERIFY_OUTCOME" = 'success' ]; then
            python recovery.py verified
          else
            python recovery.py verification-failed
          fi
          git add state/recovery.json
          git commit -m '[CF-Pages-Skip] Record public weather verification outcome'
          git push origin HEAD:main
      - name: Fail visibly on acquisition or publication failure
        if: steps.gate.outputs.action != 'none'
        run: python recovery.py result
