name: Refresh public Queensland GFS weather
on:
  schedule:
    - cron: '40 4,10,16,22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-gfs-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event.repository.private == false && vars.ENABLE_WEATHER_PIPELINE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install bounded decoder dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate code before any NOAA access
        run: python -m unittest discover -s tests -v
      - name: Reserve one attempt for this six-hour cycle
        id: reserve
        run: python pipeline.py reserve
      - name: Persist attempt before downloading (skip Pages build)
        if: steps.reserve.outputs.run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/control.json
          git commit -m '[CF-Pages-Skip] Reserve NOAA forecast cycle'
          git push origin HEAD:main
      - name: Download, validate and prepare static publication
        if: steps.reserve.outputs.run == 'true'
        run: python pipeline.py run
      - name: Validate the entire public site
        run: python validate.py public
      - name: Publish one complete commit (Pages native Git integration)
        if: steps.reserve.outputs.run == 'true'
        run: |
          git add state/control.json public
          git commit -m 'Publish verified NOAA weather and refresh status'
          git push origin HEAD:main
      - name: Verify HTTPS publication, CORS, ETag and hashes
        env:
          WEATHER_BASE_URL: ${{ vars.WEATHER_BASE_URL }}
        run: |
          test -n "$WEATHER_BASE_URL"
          python verify_remote.py "$WEATHER_BASE_URL" --wait 600
      - name: Report an unsuccessful NOAA attempt as a failed workflow
        if: steps.reserve.outputs.run == 'true'
        run: |
          python -c "import json; r=json.load(open('test-results/run.json')); raise SystemExit(1 if r['result']['status']=='failed' else 0)"
